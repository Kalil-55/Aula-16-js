<!--Crie uma função assíncrona chamada deletarItem(id) que receba o ID de um item. Esta função deve: 1. Usar o confirm() para perguntar ao usuário se ele realmente deseja deletar o item com o ID recebido. 2. Se o usuário confirmar, execute um fetch() com o método DELETE para a API de teste (ex: https://jsonplaceholder.typicode.com/posts/ID_AQUI). 3. Exiba uma mensagem de sucesso no console (Item {id} deletado com sucesso!) e uma mensagem de erro em caso de falha. Use o ID 1 como teste: deletarItem(1).-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <script>
        
        async function deletarItem(id) {

            let teste = confirm("Quer deletar?")
            let config = {
                method: "DELETE"
            }
            if (teste == true)
                fetch ("https://jsonplaceholder.typicode.com/posts/3", config)
                .then (answer => answer.json())
                .then (teste =>{
                    console.log(teste)
                } )
                

                            
        }
        deletarItem(3)

    </script>
</body>
</html>
